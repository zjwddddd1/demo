name: Update AI Workbench

# 每日自动拉取 AI HOT 数据并更新工作台
# 自动更新已于 2026-11-08 关闭（避免每日覆盖工作台样式）
# 如需手动更新数据，在 Actions 页面手动触发本 workflow
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update script
        run: python scripts/update_workbench.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add demo/tools/ai-workbench.html demo/tools/history/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: 更新 AI 工作台数据 $(TZ='Asia/Shanghai' date +%Y-%m-%d)"
            git push
          fi
