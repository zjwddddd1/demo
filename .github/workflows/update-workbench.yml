name: Update AI Workbench

on:
  schedule:
    # 北京时间每天早上 8:00 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update script
        run: python scripts/update_workbench.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add demo/tools/ai-workbench.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: 更新 AI 工作台数据 $(TZ='Asia/Shanghai' date +%Y-%m-%d)"
            git push
          fi
