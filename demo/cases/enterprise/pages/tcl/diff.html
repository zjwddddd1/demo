<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>数据核对：A版 vs B版 订单数据对比</title>
<style>
  :root {
    /* 财务严谨风：审计纸白 + 海军蓝 + 发丝灰 */
    --paper: #fbfaf6;          /* 审计纸暖白 */
    --paper-2: #f5f3ec;        /* 表头微黄 */
    --ink: #0f1b2d;            /* 深海军 */
    --ink-2: #2a3852;          /* 次级深蓝 */
    --muted: #5b6b85;
    --line: #c9c2ad;           /* 发丝色 */
    --line-soft: #e6e0cf;
    --rule: #0f1b2d;           /* 审计粗线 */
    --accent: #1c3d6e;         /* 海军蓝 */
    --accent-soft: #e8eef7;

    /* 财务状态色：低饱和 */
    --pos: #1f6b3a;            /* 林绿（B 新增）*/
    --pos-soft: #ecf3ee;
    --neg: #8a1c2b;            /* 酒红（A 删除）*/
    --neg-soft: #f6ecec;
    --mod: #8a6a14;            /* 芥末（变更）*/
    --mod-soft: #f6f0dd;
    --miss: #8a8270;           /* 缺失土灰 */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--paper); color: var(--ink);
    font-family: "Times New Roman", "Songti SC", "SimSun", "Source Han Serif SC", "Noto Serif CJK SC", serif;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  body { min-height: 100vh; }

  /* 顶栏：报表抬头 */
  header.topbar {
    padding: 18px 28px 14px;
    background: var(--paper);
    border-bottom: 2px solid var(--rule);
    position: relative;
  }
  header.topbar::after {
    content: ""; position: absolute; left: 28px; right: 28px; bottom: -5px;
    border-bottom: 1px solid var(--rule);
  }
  .title {
    font-size: 20px; font-weight: 700; letter-spacing: 0.6px;
    color: var(--ink); display: flex; align-items: baseline; gap: 14px;
  }
  .title .sub {
    font-size: 11px; font-weight: 400; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1.5px;
    border-left: 1px solid var(--line); padding-left: 12px;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
  }
  .summary {
    margin-top: 12px; display: flex; gap: 0; flex-wrap: wrap;
    border: 1px solid var(--rule); width: fit-content; background: #fff;
  }
  .chip {
    padding: 8px 18px; font-size: 12px; color: var(--ink-2);
    border-right: 1px solid var(--line);
    text-transform: uppercase; letter-spacing: 0.8px;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    display: flex; align-items: baseline; gap: 8px;
  }
  .chip:last-child { border-right: none; }
  .chip b {
    font-family: "Times New Roman", "Songti SC", serif;
    font-size: 18px; font-weight: 700; color: var(--ink);
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  .chip.only-a b { color: var(--neg); }
  .chip.only-b b { color: var(--pos); }
  .chip.mod b { color: var(--mod); }

  /* 工具栏：账册条 */
  .toolbar {
    padding: 10px 28px; background: var(--paper-2);
    border-bottom: 1px solid var(--rule);
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 12px;
  }
  .toolbar label {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--ink-2); cursor: pointer; user-select: none;
  }
  .toolbar input[type=checkbox] { accent-color: var(--accent); }
  .toolbar input[type=text] {
    background: #fff; border: 1px solid var(--line); border-radius: 0;
    color: var(--ink); padding: 6px 10px; font-size: 12px; width: 240px;
    font-family: inherit;
  }
  .toolbar input[type=text]:focus {
    outline: none; border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent);
  }
  .toolbar .btn {
    background: var(--ink); border: 1px solid var(--ink); color: #fff;
    padding: 6px 14px; border-radius: 0; font-size: 12px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px; font-family: inherit;
  }
  .toolbar .btn:hover { background: var(--accent); border-color: var(--accent); }
  .legend {
    display: inline-flex; gap: 16px; margin-left: auto; align-items: center;
    color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
  }
  .legend .mark {
    display: inline-block; width: 14px; text-align: center;
    font-weight: 700; margin-right: 4px;
    font-family: "Times New Roman", serif;
  }
  .legend .mark.neg { color: var(--neg); }
  .legend .mark.pos { color: var(--pos); }
  .legend .mark.mod { color: var(--mod); }
  .legend .mark.miss { color: var(--miss); }

  /* 双面板 */
  .panes {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    height: calc(100vh - 168px);
  }
  .pane {
    background: #fff; border-right: 1px solid var(--rule);
    display: flex; flex-direction: column; min-width: 0;
  }
  .pane:last-child { border-right: none; }
  .pane-head {
    padding: 10px 16px; background: var(--paper-2);
    border-bottom: 1px solid var(--rule);
    font-size: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  }
  .pane-head .file {
    font-weight: 700; color: var(--ink); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    letter-spacing: 0.3px;
  }
  .pane-head .meta {
    color: var(--muted); font-size: 11px; flex-shrink: 0;
    font-family: "SF Mono", "Menlo", monospace;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .pane-body { overflow: auto; flex: 1; background: #fff; }

  /* 表格：账册风 */
  table {
    border-collapse: collapse; width: max-content; min-width: 100%;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--paper-2); color: var(--ink-2);
    padding: 8px 12px;
    border-bottom: 2px solid var(--rule);
    border-right: 1px solid var(--line-soft);
    text-align: left; white-space: nowrap;
    font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.8px;
    font-family: "SF Mono", "Menlo", monospace;
  }
  thead th.pk {
    position: sticky; left: 0; z-index: 3;
    background: var(--paper-2);
    border-right: 2px solid var(--rule);
  }
  tbody td {
    padding: 7px 12px;
    border-bottom: 1px solid var(--line-soft);
    border-right: 1px solid var(--line-soft);
    white-space: nowrap; color: var(--ink);
  }
  tbody tr:nth-child(even) td { background: #fcfbf7; } /* 账册斑马纹 */
  tbody td.pk {
    position: sticky; left: 0; z-index: 1;
    background: #fff;
    border-right: 2px solid var(--rule);
    font-weight: 700;
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 11px;
    color: var(--accent);
  }
  tbody tr:nth-child(even) td.pk { background: #fcfbf7; }
  tbody tr:hover td { background: var(--accent-soft); }
  tbody tr:hover td.pk { background: var(--accent-soft); color: var(--ink); }

  /* 行状态 */
  tr.r-only td { background: var(--pos-soft) !important; }
  tr.r-only td.pk { background: var(--pos-soft) !important; color: var(--pos); }
  tr.r-only.left td { background: var(--neg-soft) !important; }
  tr.r-only.left td.pk { background: var(--neg-soft) !important; color: var(--neg); }
  tr.r-missing td {
    background: repeating-linear-gradient(
      135deg, #f5f3ec, #f5f3ec 6px, #ebe6d4 6px, #ebe6d4 7px
    ) !important;
    color: var(--miss); font-style: italic;
    text-align: center;
  }
  tr.r-modified td { background: var(--mod-soft) !important; }
  tr.r-modified td.pk { background: var(--mod-soft) !important; color: var(--mod); }
  td.cell-diff {
    background: #f3e7b8 !important;
    color: var(--ink) !important;
    font-weight: 700;
    box-shadow: inset 0 -2px 0 var(--mod);
  }

  tr.row-highlight td {
    outline: 2px solid var(--accent); outline-offset: -2px;
    background: var(--accent-soft) !important;
  }

  /* 状态符号徽章（替代色块 chip）*/
  .badge {
    display: inline-block; min-width: 16px; text-align: center;
    padding: 0 6px; margin-left: 6px; font-size: 11px;
    font-family: "SF Mono", "Menlo", monospace;
    font-weight: 700; letter-spacing: 0.5px;
    border: 1px solid currentColor;
    background: #fff;
  }
  .badge.b-only-a { color: var(--neg); }
  .badge.b-only-b { color: var(--pos); }
  .badge.b-mod { color: var(--mod); }

  /* 差异清单（审计明细表） */
  .diff-panel {
    background: var(--paper); border-top: 2px solid var(--rule);
    max-height: 30vh; overflow: auto; padding: 12px 28px 16px;
  }
  .diff-panel h3 {
    margin: 0 0 10px 0; font-size: 13px; font-weight: 700;
    color: var(--ink); letter-spacing: 0.5px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line); padding-bottom: 6px;
  }
  .diff-panel h3 small {
    font-weight: 400; color: var(--muted); font-size: 11px;
    text-transform: none; letter-spacing: 0;
    font-family: "SF Mono", "Menlo", monospace; margin-left: 8px;
  }
  .diff-panel table {
    width: 100%; font-size: 12px; background: #fff;
    border: 1px solid var(--line);
  }
  .diff-panel th {
    background: var(--paper-2); padding: 7px 10px;
    border-bottom: 2px solid var(--rule); text-align: left;
    color: var(--ink-2); font-weight: 600;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
    font-family: "SF Mono", "Menlo", monospace;
  }
  .diff-panel td {
    padding: 6px 10px; border-bottom: 1px solid var(--line-soft);
    color: var(--ink);
  }
  .diff-panel tr.t-only-a td { background: #fbf3f3; }
  .diff-panel tr.t-only-b td { background: #f3f7f3; }
  .diff-panel tr.t-modified td { background: #fbf6e8; }
  .diff-panel tr:hover td { background: var(--accent-soft); cursor: pointer; }

  /* 类型标签 */
  .tag {
    display: inline-block; padding: 1px 8px; font-size: 11px;
    font-family: "SF Mono", "Menlo", monospace; font-weight: 600;
    letter-spacing: 0.5px; border: 1px solid; background: #fff;
  }
  .tag.t-a { color: var(--neg); }
  .tag.t-b { color: var(--pos); }
  .tag.t-m { color: var(--mod); }

  .diff-panel code {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 11px; background: var(--paper-2);
    padding: 1px 5px; border: 1px solid var(--line-soft);
  }
  .diff-panel code.va { color: var(--neg); }
  .diff-panel code.vb { color: var(--pos); }
  .diff-panel .arrow { color: var(--muted); margin: 0 6px; font-family: "Times New Roman", serif; }

  /* 滚动条：低调 */
  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-track { background: var(--paper-2); }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-2); }

  /* 附件下载区（财务严谨风） */
  .downloads {
    display:flex; align-items:center; gap:0;
    background: var(--paper-2);
    border-top: 1px solid var(--line);
    border-bottom: 2px solid var(--rule);
    padding: 10px 24px;
    font-family: "SF Mono","Menlo",monospace;
    font-size: 12px;
    letter-spacing: .04em;
  }
  .downloads .dl-label {
    color: var(--ink); text-transform: uppercase; font-weight: 600;
    margin-right: 18px;
  }
  .downloads a.dl-item {
    display:inline-flex; align-items:center; gap:8px;
    padding: 6px 14px;
    color: var(--ink);
    text-decoration: none;
    background: var(--paper);
    border: 1px solid var(--line);
    border-right: none;
    transition: background .15s, color .15s;
  }
  .downloads a.dl-item:last-of-type { border-right: 1px solid var(--line); }
  .downloads a.dl-item:hover {
    background: var(--ink); color: var(--paper);
  }
  .downloads a.dl-item .glyph {
    font-family: "Times New Roman","Songti SC",serif;
    font-size: 15px; line-height: 1;
  }
  .downloads a.dl-item.a .glyph { color: var(--neg); }
  .downloads a.dl-item.b .glyph { color: var(--pos); }
  .downloads a.dl-item:hover .glyph { color: inherit; }
  .downloads .dl-meta {
    margin-left: auto;
    color: var(--ink-2);
    font-size: 11px;
  }

</style>
</head>
<body>
<header class="topbar">
  <div class="title">数据核对底稿 <span class="sub">A版 ／ B版　累计下单企业明细　差异清册</span></div>
  <div class="summary" id="summary"></div>
</header>
<div class="downloads" id="downloads">
  <span class="dl-label">附件 / Attachments</span>

</div>

  function b64ToBlob(b64){
    const bin = atob(b64);
    const len = bin.length;
    const buf = new Uint8Array(len);
    for (let i = 0; i < len; i++) buf[i] = bin.charCodeAt(i);
    return new Blob([buf], {type: MIME});

  function wire(id, b64){
    const a = document.getElementById(id);

      const tmp = document.createElement('a');
      tmp.href = url;
      tmp.download = a.getAttribute('download') || 'download.xlsx';

      tmp.click();

    }
    if (rowMeta.status === 'only') {
      tr.className = 'r-only' + (side === 'A' ? ' left' : '');
      tr.dataset.kind = side === 'A' ? 'only-a' : 'only-b';
    } else if (rowMeta.status === 'modified') {
      tr.className = 'r-modified';
      tr.dataset.kind = 'modified';
    } else {
      tr.dataset.kind = 'same';
    }
    const diffSet = new Set(rowMeta.diff_cols || []);
    rowMeta.values.forEach((v, i) => {
      const td = document.createElement('td');
      if (i === 1) {
        td.className = 'pk';
        td.innerHTML = `${v}` +
          (rowMeta.status === 'only' ? `<span class="badge ${side==='A'?'b-only-a':'b-only-b'}">${side==='A'?'− A':'＋ B'}</span>` :
           rowMeta.status === 'modified' ? `<span class="badge b-mod">△ MOD</span>` : '');
      } else {
        td.textContent = v === null || v === undefined ? '' : String(v);
      }
      if (diffSet.has(i)) td.classList.add('cell-diff');
      tr.appendChild(td);
    });
    return tr;
  }

  const tbA = document.getElementById('tbodyA');
  const tbB = document.getElementById('tbodyB');
  data.rows_a.forEach(r => tbA.appendChild(renderRow(r, 'A')));
  data.rows_b.forEach(r => tbB.appendChild(renderRow(r, 'B')));

  // 差异清单
  const diffTbody = document.getElementById('diffTbody');
  document.getElementById('diffCount').textContent = data.diff_details.length;
  data.diff_details.forEach(d => {
    const tr = document.createElement('tr');
    tr.dataset.id = d.id;
    if (d.type === 'only_a') {
      tr.className = 't-only-a';
      tr.innerHTML = `<td><span class="tag t-a">− 仅A</span></td><td>${d.id}</td><td>${d.name||''}</td><td>B 版本中已剔除该记录（uin=${d.uin||''}）</td>`;
    } else if (d.type === 'only_b') {
      tr.className = 't-only-b';
      tr.innerHTML = `<td><span class="tag t-b">＋ 仅B</span></td><td>${d.id}</td><td>${d.name||''}</td><td>A 版本中尚未存在该记录（uin=${d.uin||''}）</td>`;
    } else {
      tr.className = 't-modified';
      const cellDesc = d.cells.map(c => `<b>${c.field}</b>　A <code class="va">${c.a}</code><span class="arrow">→</span><code class="vb">${c.b}</code>`).join('　|　');
      tr.innerHTML = `<td><span class="tag t-m">△ 变更</span></td><td>${d.id}</td><td>${d.name||''}</td><td>${cellDesc}</td>`;
    }
    tr.addEventListener('click', () => jumpTo(d.id));
    diffTbody.appendChild(tr);
  });

  // 同步滚动
  const bodyA = document.getElementById('bodyA');
  const bodyB = document.getElementById('bodyB');
  let lock = false;
  function bind(src, dst) {
    src.addEventListener('scroll', () => {
      if (!document.getElementById('syncScroll').checked) return;
      if (lock) return;
      lock = true;
      dst.scrollTop = src.scrollTop;
      dst.scrollLeft = src.scrollLeft;
      requestAnimationFrame(() => lock = false);
    });
  }
  bind(bodyA, bodyB);
  bind(bodyB, bodyA);

  // 仅显示差异
  document.getElementById('filterDiff').addEventListener('change', e => {
    const onlyDiff = e.target.checked;
    [tbA, tbB].forEach(tb => {
      tb.querySelectorAll('tr').forEach(tr => {
        const k = tr.dataset.kind;
        if (!onlyDiff) tr.style.display = '';
        else tr.style.display = (k && k !== 'same') ? '' : 'none';
      });
    });
  });

  // 搜索
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    [tbA, tbB].forEach(tb => {
      tb.querySelectorAll('tr').forEach(tr => {
        const text = tr.textContent.toLowerCase();
        tr.style.display = !q || text.includes(q) ? '' : 'none';
      });
    });
  });

  function jumpTo(id) {
    const trA = tbA.querySelector(`tr[data-id="${id}"]`);
    const trB = tbB.querySelector(`tr[data-id="${id}"]`);
    document.querySelectorAll('tr.row-highlight').forEach(t => t.classList.remove('row-highlight'));
    if (trA) { trA.classList.add('row-highlight'); trA.scrollIntoView({block:'center', behavior:'smooth'}); }
    if (trB) { trB.classList.add('row-highlight'); trB.scrollIntoView({block:'center', behavior:'smooth'}); }
  }

  document.getElementById('jumpFirst').addEventListener('click', () => {
    if (data.diff_details.length) jumpTo(data.diff_details[0].id);
  });
}
init();
</script>
</body>
</html>
