<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>访问验证 · S2 财经线</title>
<style>
  :root{
    --bg:#f6f8fc;
    --card:#ffffff;
    --border:#e3e8f1;
    --text:#1a2540;
    --muted:#6b7896;
    --accent:#3b82f6;
    --accent-hover:#2563eb;
    --error:#dc2626;
    --input-bg:#f8faff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(59,130,246,.10), transparent 60%),
      radial-gradient(800px 500px at 0% 110%, rgba(99,102,241,.08), transparent 60%),
      var(--bg);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .wrap{
    width:100%;max-width:420px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:36px 32px 28px;
    box-shadow:0 12px 40px rgba(30,50,100,.08), 0 2px 8px rgba(30,50,100,.04);
  }
  .copyright-top{
    background:linear-gradient(180deg,#eef3fc,#e7eefb);
    border:1px solid #d6e0f2;
    border-radius:10px;
    padding:11px 14px;
    font-size:12.5px;color:#3b4a70;line-height:1.65;
    text-align:center;margin-bottom:22px;
  }
  .copyright-top strong{color:#1a2540;font-weight:600;letter-spacing:.05em}
  .brand{
    font-size:12px;letter-spacing:.18em;
    color:#8896b6;text-transform:uppercase;margin-bottom:12px;
  }
  h1{
    font-size:22px;font-weight:600;margin:0 0 8px;color:#0f1a36;
  }
  .desc{
    color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 24px;
  }
  label{
    display:block;font-size:12px;color:var(--muted);margin-bottom:8px;
  }
  input[type=password]{
    width:100%;padding:13px 14px;
    background:var(--input-bg);border:1px solid var(--border);border-radius:10px;
    color:var(--text);font-size:15px;letter-spacing:.15em;
    outline:none;transition:border-color .2s, box-shadow .2s, background .2s;
  }
  input[type=password]:focus{
    border-color:var(--accent);
    background:#ffffff;
    box-shadow:0 0 0 3px rgba(59,130,246,.15);
  }
  button{
    width:100%;margin-top:16px;
    background:var(--accent);color:#fff;
    border:none;border-radius:10px;
    padding:13px 14px;font-size:15px;font-weight:500;
    cursor:pointer;transition:background .2s, box-shadow .2s;
    box-shadow:0 4px 12px rgba(59,130,246,.25);
  }
  button:hover{background:var(--accent-hover);box-shadow:0 6px 16px rgba(59,130,246,.32)}
  button:active{transform:translateY(1px)}
  .err{
    color:var(--error);font-size:12px;margin-top:10px;min-height:16px;
  }
  .footer{
    margin-top:28px;padding-top:18px;
    border-top:1px solid var(--border);
    text-align:center;font-size:12px;color:#8896b6;line-height:1.7;
  }
  .footer strong{color:#3b4a70;font-weight:500;letter-spacing:.05em}
</style>
</head>
<body>
  <div class="wrap">
    <div class="copyright-top">本材料版权归属 <strong>S2 财经线</strong><br/>未经授权，禁止复制、转发或对外分享</div>

    <div class="brand">CONFIDENTIAL · ACCESS GATE</div>
    <h1>请输入访问密码</h1>
    <p class="desc">本案例为内部演示材料，需密码授权方可查看。</p>

    <form id="f" autocomplete="off" onsubmit="return check(event)">
      <label for="p">访问密码</label>
      <input id="p" type="password" inputmode="numeric" maxlength="20" autofocus />
      <div class="err" id="err">&nbsp;</div>
      <button type="submit">进入</button>
    </form>

    <div class="footer">
      版权归属 <strong>S2 财经线</strong><br/>
      未经授权，禁止复制、转发或对外分享
    </div>
  </div>

<script>
(function(){
  // 简单 hash，避免明文
  function h(s){
    var x = 0;
    for (var i=0;i<s.length;i++){ x = ((x<<5)-x + s.charCodeAt(i)) | 0; }
    return x.toString(16);
  }
  var EXPECTED = h("12344321");
  var KEY = "s2_gate_pass_v1";

  // 已通过 → 直接跳转
  try{
    if (sessionStorage.getItem(KEY) === EXPECTED){
      location.replace("content.html");
      return;
    }
  }catch(e){}

  window.check = function(ev){
    ev.preventDefault();
    var v = document.getElementById("p").value.trim();
    var err = document.getElementById("err");
    if (h(v) === EXPECTED){
      try{ sessionStorage.setItem(KEY, EXPECTED); }catch(e){}
      err.textContent = "";
      location.replace("content.html");
    }else{
      err.textContent = "密码不正确，请重试";
      document.getElementById("p").select();
    }
    return false;
  };
})();
</script>
</body>
</html>
