<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 产品工作台 · 家纬</title>
<!-- 自定义 Favicon：天蓝渐变图标 -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2360a5fa'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-family='system-ui,-apple-system,sans-serif' font-weight='700' font-size='18'%3EW%3C/text%3E%3C/svg%3E">
<style>
/* ===== 配色体系：天空蓝渐变（左浅右深）===== */
:root {
  /* 背景层 — 天空渐变 */
  --bg: transparent;                    /* 侧边栏：半透融入渐变 */
  --bg-secondary: transparent;          /* 主区域：半透融入渐变 */
  --bg-card: rgba(240, 248, 255, 0.35); /* 更透明，让呼吸可见 */
  --bg-glass: rgba(96, 165, 250, 0.06);

  /* 文字层级 — 深靛蓝 */
  --text: #1e293b;
  --text-secondary: #475569;
  --text-tertiary: #94a3b8;

  /* 主色：天空蓝 */
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --primary-light: #eff6ff;
  --primary-lighter: rgba(59, 130, 246, 0.10);
  --primary-dark: #1d4ed8;
  --primary-glow: rgba(59, 130, 246, 0.28);

  /* 辅助色：钴蓝 */
  --accent: #60a5fa;
  --accent-light: #dbeafe;

  /* 边框与阴影 — 蓝调 */
  --border: rgba(148, 163, 184, 0.30);
  --border-focus: rgba(96, 165, 250, 0.55);
  --shadow-sm: 0 1px 3px rgba(30, 41, 59, 0.06), 0 1px 2px rgba(30, 41, 59, 0.04);
  --shadow-md: 0 4px 14px rgba(30, 41, 59, 0.08), 0 2px 6px rgba(30, 41, 59, 0.05);
  --shadow-lg: 0 12px 36px rgba(30, 41, 59, 0.11), 0 4px 14px rgba(30, 41, 59, 0.06);
  --shadow-hover: 0 8px 26px rgba(59, 130, 246, 0.15), 0 4px 10px rgba(59, 130, 246, 0.08);
  --shadow-glow: 0 0 0 1px var(--border-focus), 0 0 20px var(--primary-glow);

  /* 圆角 */
  --radius: 14px;
  --radius-sm: 10px;
  --radius-xs: 7px;

  /* 分类色彩（保持鲜明） */
  --cat-model: #7c3aed;   --cat-model-bg: #f5f3ff;
  --cat-product: #2563eb;--cat-product-bg: #eff6ff;
  --cat-industry: #dc2626;--cat-industry-bg: #fef2f2;
  --cat-paper: #059669;  --cat-paper-bg: #ecfdf5;
  --cat-tip: #d97706;    --cat-tip-bg: #fffbeb;

  /* 功能色 */
  --star: #f59e0b;
  --green: #059669;      --green-bg: #ecfdf5;
  --red: #dc2626;        --red-bg: #fef2f2;

  /* 布局 */
  --sidebar-w: 260px;
  --transition: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: 0.18s ease;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  /* body 本身：固定淡蓝底，无动画 */
  background: #f0f8ff;
  color: var(--text);
  line-height: 1.6;
  display: flex;
  min-height: 100vh;
}

/* ===== 主看板：呼吸式深浅交替 ===== */
.main {
  margin-left: var(--sidebar-w);
  flex: 1; padding: 28px 32px; overflow-y: auto;
  /* 基础底色：最浅 */
  background-color: #f0f8ff;
  position: relative;
}
/* 深色覆盖层：通过 opacity 呼吸实现深浅交替 */
.main::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0; pointer-events: none;
  opacity: 0; /* 默认隐藏，由模式类控制显示 */
}

/* 卡片层要在渐变之上 */
.cards-grid { position: relative; z-index: 1; }
.top-bar { position: relative; z-index: 2; }
.result-count { position: relative; z-index: 2; }

/* 呼吸动画：浅→深→浅，缓进缓出 */
@keyframes breatheColor {
  0%, 100% { opacity: 0; }
  50%       { opacity: 1; }
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--sidebar-w);
  /* 固定淡蓝底，无渐变，不流动 */
  background: #f0f8ff;
  border-right: 1px solid rgba(148, 163, 184, 0.22);
  padding: 24px 18px;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  z-index: 10;
  /* 侧边栏顶部装饰线 — 绿色 */
  border-top: 3px solid transparent;
  border-image: linear-gradient(90deg, var(--primary), var(--accent)) 1;
}

.sidebar-header { text-align: center; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 {
  font-size: 20px; font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 2px;
  letter-spacing: -0.3px;
}
.sidebar-header .subtitle { font-size: 12px; color: var(--text-tertiary); font-weight: 500; }

.date-display { text-align: center; padding: 6px 0 12px; }
.date-display .date-str { font-size: 13px; color: var(--text-secondary); font-weight: 500; }

.search-box { position: relative; }
.search-box input {
  width: 100%; padding: 9px 12px 9px 34px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-size: 13px; background: var(--bg-secondary);
  outline: none; transition: all var(--transition);
}
.search-box input:focus {
  border-color: var(--primary);
  background: var(--bg);
  box-shadow: 0 0 0 3px var(--primary-lighter);
}
.search-box .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 13px; }

.filter-section h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--text-tertiary); margin-bottom: 8px; font-weight: 700;
}

.filter-tags { display: flex; flex-direction: column; gap: 5px; align-items: stretch; }
.filter-tag {
  padding: 7px 11px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer;
  border: 1.5px solid var(--border); background: var(--bg); color: var(--text-secondary);
  transition: all var(--transition); white-space: nowrap; font-weight: 500;
  text-align: center;
}
.filter-tag:hover:not(.active) {
  background: var(--primary-lighter);
  border-color: var(--border-focus);
  color: var(--primary);
}
.filter-tag.active {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white; border-color: transparent;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
}

/* History date picker */
.history-section { display: flex; flex-direction: column; gap: 6px; }
.history-datepicker {
  padding: 9px 12px; border-radius: var(--radius-sm); font-size: 13px;
  border: 1.5px solid var(--border); background: var(--bg); color: var(--text);
  transition: all var(--transition); font-weight: 500; cursor: pointer;
  width: 100%; outline: none; font-family: inherit;
}
.history-datepicker:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-lighter); }
.history-datepicker:hover { border-color: var(--border-focus); }
.history-hint { font-size: 11px; color: var(--text-tertiary); text-align: center; padding: 2px 0; }

/* Clickable Stats */
.stats { display: flex; flex-direction: column; gap: 6px; }

.stat-btn {
  display: flex; justify-content: space-between; align-items: center;
  width: 100%; padding: 10px 14px;
  border-radius: var(--radius-sm); border: 1.5px solid var(--border);
  background: var(--bg); cursor: pointer;
  font-size: 13px; color: var(--text-secondary);
  transition: all var(--transition); text-align: left;
}
.stat-btn:hover {
  background: var(--primary-lighter);
  border-color: var(--border-focus);
}
.stat-btn:hover .stat-num { color: var(--primary); }
.stat-btn.active {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white; border-color: transparent;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
}
.stat-btn.active .stat-label { color: rgba(255,255,255,0.9); }
.stat-btn.active .stat-num { color: white; }
.stat-btn .stat-label { font-size: 12px; color: var(--text-tertiary); transition: color var(--transition); }
.stat-btn .stat-num { font-size: 20px; font-weight: 800; transition: color var(--transition); }
.stat-btn .stat-hint { font-size: 10px; color: var(--text-tertiary); margin-top: 1px; display: block; }
.stat-btn.active .stat-hint { color: rgba(255,255,255,0.65); }

.sidebar-actions { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.sidebar-btn {
  width: 100%; padding: 9px 12px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--bg);
  cursor: pointer; font-size: 13px; color: var(--text-secondary);
  transition: all var(--transition); text-align: center; font-weight: 500;
}
.sidebar-btn:hover {
  background: var(--primary-lighter);
  color: var(--primary);
  border-color: var(--border-focus);
}
.sidebar-btn .badge {
  display: inline-block; background: var(--text-tertiary); color: white;
  border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 4px; min-width: 20px;
}

/* Top bar */
.top-bar {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}

.top-bar-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.top-bar-left h2 {
  font-size: 22px; font-weight: 800; white-space: nowrap;
  letter-spacing: -0.3px;
}

/* Active filter chips */
.active-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }

.filter-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 16px;
  font-size: 12px; font-weight: 600;
  background: var(--primary-light); color: var(--primary);
  border: 1px solid var(--border-focus);
  animation: chipIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.filter-chip .chip-close {
  cursor: pointer; font-size: 14px; line-height: 1; opacity: 0.6;
  transition: opacity var(--transition-fast); margin-left: 2px;
}
.filter-chip .chip-close:hover { opacity: 1; }

@keyframes chipIn {
  from { opacity: 0; transform: scale(0.85) translateY(-4px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.top-bar-right { display: flex; gap: 8px; align-items: center; }

.sort-btn {
  padding: 7px 14px; border-radius: var(--radius-xs); border: 1.5px solid var(--border);
  background: var(--bg); cursor: pointer; font-size: 12px; color: var(--text-secondary);
  transition: all var(--transition); font-weight: 500; white-space: nowrap;
}
.sort-btn:hover {
  background: var(--primary-lighter);
  border-color: var(--border-focus);
  color: var(--primary);
}
.sort-btn.active {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white; border-color: transparent;
  box-shadow: 0 2px 6px rgba(99, 102, 241, 0.25);
}

.result-count {
  font-size: 13px; color: var(--text-secondary); white-space: nowrap; font-weight: 600;
  padding: 4px 12px; border-radius: 12px;
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(148, 163, 184, 0.25);
  transition: all var(--transition);
  z-index: 1; position: relative;
}

/* ===== 渐变开关 ===== */
.gradient-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: var(--radius-xs);
  border: 1.5px solid var(--border); cursor: pointer;
  background: var(--bg-card); backdrop-filter: blur(8px);
  font-size: 12px; color: var(--text-secondary);
  transition: all var(--transition); font-weight: 500; white-space: nowrap;
  user-select: none; position: relative; z-index: 51;
}
.gradient-toggle:hover { border-color: var(--border-focus); }
.gradient-toggle.active {
  border-color: var(--primary); color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-lighter);
}
.gradient-toggle .toggle-dot {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--border); transition: all var(--transition);
}
.gradient-toggle.active .toggle-dot {
  background: linear-gradient(135deg, #f0f8ff, #6fb0e0);
  box-shadow: 0 0 6px rgba(59,130,246,0.4);
}

/* 下拉菜单 */
.gradient-dropdown {
  display: none; position: absolute; top: calc(100% + 8px); right: 0;
  background: rgba(255, 255, 255, 0.97);
  backdrop-filter: blur(24px) saturate(2);
  -webkit-backdrop-filter: blur(24px) saturate(2);
  border-radius: 12px;
  box-shadow: 0 8px 36px rgba(0,0,0,0.14), 0 2px 10px rgba(0,0,0,0.06);
  border: 1px solid rgba(148,163,184,0.22);
  min-width: 230px; z-index: 100; overflow: hidden;
  padding: 6px 0;
  animation: dropdownIn 0.2s cubic-bezier(0.22,1,0.36,1);
}
.gradient-dropdown.show { display: block; }
@keyframes dropdownIn {
  from { opacity: 0; transform: translateY(-6px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.gradient-option {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 18px; cursor: pointer; font-size: 13px;
  color: var(--text-secondary); transition: all 0.15s;
}
.gradient-option:hover { background: var(--primary-lighter); color: var(--primary); }
.gradient-option.selected { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.gradient-option .opt-dot {
  width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0;
  border: 2px solid transparent; transition: border-color 0.15s;
}
.gradient-option.selected .opt-dot { border-color: var(--primary); }
.gradient-option .opt-dot.off  { background: #cbd5e1; }
.gradient-option .opt-dot.hori { background: linear-gradient(90deg, #e0f0ff, #6fb0e0); }
.gradient-option .opt-dot.diag { background: linear-gradient(to bottom left, #6fb0e0, #e0f0ff); }
.gradient-option .opt-dot.upload { background: var(--border-focus); }

/* 模式类同上 */
.main.gradient-off::before { opacity: 0 !important; }
.main.gradient-off { background-color: #f0f8ff; }

.main.gradient-hori::before {
  opacity: 1;
  background: linear-gradient(90deg, #eaf6ff, #c8e6fb, #a0d0f0, #6fb0e0);
  animation: breatheColor 12s ease-in-out infinite;
}
@keyframes breatheColor {
  0%, 100% { opacity: 0; }
  50%      { opacity: 1; }
}

.main.gradient-diag::before {
  opacity: 1;
  background: linear-gradient(to bottom left, #6fb0e0, #9bc8ec, #c8e6fb, #eaf6ff);
  animation: diagSpread 15s ease-in-out infinite;
}
@keyframes diagSpread {
  0%   { opacity: 0.3; }
  50%  { opacity: 1;    }
  100% { opacity: 0.3;  }
}

.main.gradient-custom::before {
  opacity: 1;
  background: var(--custom-gradient, linear-gradient(90deg, #eaf6ff, #c8e6fb, #6fb0e0));
  animation: breatheColor 12s ease-in-out infinite;
}

/* 自定义上传行 */
.gradient-upload-row {
  display: flex; align-items: center; gap: 8px; padding: 9px 18px;
  border-top: 1px solid var(--border); background: rgba(240,248,255,0.5);
}
.upload-label {
  font-size: 12px; cursor: pointer; color: var(--primary); font-weight: 500;
  transition: opacity var(--transition);
}
.upload-label:hover { opacity: 0.7; }
#gradientFileInput { display: none; }
.upload-status { font-size: 11px; margin-left: auto; font-weight: 500; }
.upload-status.ok { color: var(--green); }
.gradient-upload-hint {
  font-size: 10px; color: var(--text-tertiary); padding: 4px 18px 8px;
  background: rgba(240,248,255,0.5);
}

/* ===== CARDS ===== */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
  gap: 16px;
}

.card {
  background: var(--bg-card);
  backdrop-filter: blur(12px) saturate(1.4);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  border-radius: var(--radius);
  padding: 20px 22px;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(255, 255, 255, 0.45);
  transition: all var(--transition);
  display: flex; flex-direction: column; gap: 11px;
  position: relative;
  cursor: default;
  /* 入场动画初始状态 */
  opacity: 0;
  transform: translateY(20px);
}
/* 入场动画：依次淡入上滑（慢速，可完整观察） */
.card.animate-in {
  animation: cardEnter 3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes cardEnter {
  from {
    opacity: 0;
    transform: translateY(32px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ===== 增强版 Hover 动效 ===== */
.card:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-5px) scale(1.012);
  border-color: var(--border-focus);
  z-index: 5;
}
.card:hover .card-title {
  color: var(--primary);
}
.card:hover .btn-link {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  border-color: transparent;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
}
.card:hover .category-tag {
  transform: scale(1.05);
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.card.unread {
  border-left: 3px solid var(--primary);
  padding-left: 18px;
  background: rgba(240, 248, 255, 0.42);
}
.card.unread::after {
  content: 'NEW';
  position: absolute; top: 12px; right: 14px;
  font-size: 10px; font-weight: 800; color: var(--primary);
  background: linear-gradient(135deg, var(--primary-light), var(--accent-light));
  padding: 2px 9px; border-radius: 8px;
  letter-spacing: 0.6px;
  pointer-events: none;
  border: 1px solid var(--border-focus);
}
/* 已读卡片：同样半透蓝白，保持视觉一致 */
.card.read {
  background: rgba(240, 248, 255, 0.35);
}

.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }

.card-title {
  font-size: 15px; font-weight: 700; line-height: 1.45; color: var(--text);
  flex: 1; margin-right: 36px;
  transition: color var(--transition);
}

.card-meta {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  font-size: 12px; color: var(--text-tertiary);
}
.card-source { font-weight: 600; color: var(--text-secondary); }
.card-score {
  font-weight: 700; font-size: 11px;
  padding: 1px 8px; border-radius: 10px;
}
.score-hot { background: #fef2f2; color: #dc2626; }
.score-warm { background: #fff7ed; color: #ea580c; }
.score-normal { background: rgba(148, 163, 184, 0.12); color: #475569; }

.card-summary {
  font-size: 13px; line-height: 1.7; color: var(--text-secondary);
}

.category-tag {
  display: inline-block; padding: 3px 10px; border-radius: 10px;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
  transition: all var(--transition-fast);
}
.cat-model { background: var(--cat-model-bg); color: var(--cat-model); }
.cat-product { background: var(--cat-product-bg); color: var(--cat-product); }
.cat-industry { background: var(--cat-industry-bg); color: var(--cat-industry); }
.cat-paper { background: var(--cat-paper-bg); color: var(--cat-paper); }
.cat-tip { background: var(--cat-tip-bg); color: var(--cat-tip); }

.card-actions { display: flex; gap: 8px; align-items: center; }

.btn-star {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 14px; cursor: pointer; background: none; border: none;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); padding: 4px 8px;
  color: var(--text-tertiary); line-height: 1;
  border-radius: 6px;
}
.btn-star:hover {
  background: rgba(245, 158, 11, 0.1);
  color: var(--star);
  transform: scale(1.1);
}
.btn-star.starred {
  color: var(--star);
  background: rgba(245, 158, 11, 0.12);
  filter: drop-shadow(0 1px 2px rgba(245, 158, 11, 0.3));
}
.btn-star .star-hint {
  font-size: 11px; font-weight: 500; color: var(--text-tertiary);
  transition: opacity 0.2s;
  white-space: nowrap;
}
.btn-star:hover .star-hint { color: var(--star); }
.btn-star.starred .star-hint { color: var(--star); }

.btn-link {
  color: var(--primary); text-decoration: none; font-weight: 600;
  font-size: 12px; padding: 6px 14px; border-radius: 7px;
  border: 1.5px solid var(--border-focus); background: var(--primary-light);
  transition: all var(--transition); display: inline-block;
}
.btn-link:hover {
  text-decoration: none;
  transform: translateY(-1px);
}

/* Empty state */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-tertiary); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; margin-bottom: 4px; }
.empty-state .hint { font-size: 12px; }

/* ===== TOAST ===== */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 10px 18px; border-radius: var(--radius-sm);
  background: var(--text); color: white; font-size: 13px;
  box-shadow: var(--shadow-lg);
  animation: toastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), toastOut 0.25s ease 2s forwards;
  max-width: 280px; font-weight: 500;
}
.toast.success { background: linear-gradient(135deg, #059669, #10b981); }
.toast.info { background: linear-gradient(135deg, var(--primary), var(--accent)); }
@keyframes toastIn { from { opacity:0; transform:translateX(30px) scale(0.95); } to { opacity:1; transform:translateX(0) scale(1); } }
@keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateY(-10px) scale(0.98); } }

/* ===== DRAWER ===== */
.drawer-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(30, 41, 59, 0.30); z-index: 20; display: none;
  backdrop-filter: blur(4px);
}
.drawer-overlay.show { display: block; }

.drawer {
  position: fixed; top: 0; right: -480px; width: 440px; bottom: 0;
  background: rgba(255, 255, 255, 0.80);
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
  box-shadow: -8px 0 32px rgba(30, 41, 59, 0.12);
  z-index: 25; transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; flex-direction: column; overflow: hidden;
}
.drawer.show { right: 0; }

.drawer-header {
  padding: 18px 24px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.drawer-header h3 { font-size: 16px; font-weight: 700; }
.drawer-close {
  background: none; border: none; font-size: 20px; cursor: pointer;
  color: var(--text-tertiary); padding: 4px; border-radius: 6px;
  transition: all var(--transition);
}
.drawer-close:hover { background: var(--primary-lighter); color: var(--primary); }

.drawer-body { flex: 1; overflow-y: auto; padding: 14px 24px; }
.drawer-empty { text-align: center; color: var(--text-tertiary); padding: 48px 20px; font-size: 13px; }
.drawer-item {
  padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: 8px; font-size: 13px;
  transition: all var(--transition-fast);
}
.drawer-item:hover { border-color: var(--border-focus); background: var(--primary-lighter); }
.drawer-item .title { font-weight: 600; margin-bottom: 2px; line-height: 1.4; }
.drawer-item .meta { font-size: 11px; color: var(--text-tertiary); margin-bottom: 4px; }
.drawer-item .remove-btn {
  background: none; border: none; color: #dc2626; cursor: pointer;
  font-size: 12px; float: right; margin-top: 2px; padding: 2px 6px;
  border-radius: 4px; transition: all var(--transition-fast);
}
.drawer-item .remove-btn:hover { background: var(--red-bg); }
.drawer-item a { font-size: 11px; color: var(--primary); text-decoration: none; font-weight: 600; }
.drawer-item a:hover { text-decoration: underline; }

/* ===== RESPONSIVE ===== */
@media (max-width: 1024px) {
  .cards-grid { grid-template-columns: 1fr; }
}

@media (max-width: 860px) {
  body { flex-direction: column; }
  .sidebar {
    width: 100%; position: relative; flex-direction: row; flex-wrap: wrap;
    padding: 12px; gap: 8px; border-right: none;
    border-bottom: 1px solid var(--border); overflow-y: visible; max-height: none;
  }
  .sidebar-header { display: none; }
  .date-display, .search-box { display: none; }
  .stats { flex-direction: row; gap: 6px; }
  .stat-btn { flex-direction: column; align-items: flex-start; padding: 8px 12px; }
  .stat-btn .stat-num { font-size: 16px; }
  .filter-section { display: none; }
  .sidebar-actions { flex-direction: row; }
  .main { margin-left: 0; padding: 14px; }
  .top-bar { flex-direction: column; }
  .drawer { width: 100%; right: -100%; }
}

@media (max-width: 500px) {
  .main { padding: 10px; }
  .card { padding: 14px 16px; }
  .top-bar-left h2 { font-size: 18px; }
  .cards-grid { gap: 12px; }
}

// ===== HELPERS =====
function timeAgo(iso) {
  const d = new Date(iso), now = new Date();
  const diff = now - d;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + ' 分钟前';
  const hrs = Math.floor(diff / 3600000);
  if (hrs < 24) return hrs + ' 小时前';
  const days = Math.floor(diff / 86400000);
  if (days < 2) return '昨天';
  if (days < 7) return days + ' 天前';
  const bj = new Date(d.getTime() + 8*3600000);
  return bj.toLocaleDateString('zh-CN', { month:'numeric', day:'numeric' });
}

function timeFull(iso) {
  const bj = new Date(new Date(iso).getTime() + 8*3600000);
  return bj.toLocaleDateString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function scoreClass(s) {
  if (s >= 80) return 'score-hot';
  if (s >= 70) return 'score-warm';
  return 'score-normal';
}

// 将嵌入式 DATA 合并到归档中（按 id 去重），首次或每次有新数据时自动累积
function seedArchive() {
  let added = 0;
  const existingIds = new Set(dataArchive.map(d => d.id));
  for (const item of DATA) {
    if (!existingIds.has(item.id)) {
      dataArchive.push(item);
      added++;
    }
  }
  if (added > 0) {
    saveArchive();
    console.log('归档新增 ' + added + ' 条，总计 ' + dataArchive.length + ' 条');
  }
}

// 按日期分组（北京时区），返回 { dateStr: [items...] }
function groupByDate(items) {
  const groups = {};
  for (const item of items) {
    const d = new Date(new Date(item.publishedAt).getTime() + 8 * 3600000);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if (!groups[key]) groups[key] = [];
    groups[key].push(item);
  }
  return groups;
}

// 尝试从 history JSON 拉取额外数据扩充归档
async function fetchAndMergeHistory(dateStr) {
  try {
    const resp = await fetch(`${HISTORY_BASE}${dateStr}.json`);
    if (!resp.ok) return;
    const remoteData = await resp.json();
    const existingIds = new Set(dataArchive.map(d => d.id));
    let added = 0;
    for (const item of remoteData) {
      if (!existingIds.has(item.id)) {
        dataArchive.push(item);
        added++;
      }
    }
    if (added > 0) {
      saveArchive();
      console.log('从远程合并 ' + added + ' 条（' + dateStr + '），总计 ' + dataArchive.length + ' 条');
    }
  } catch(e) { /* 静默忽略 */ }
}

// 自动拉取最近日期的历史数据以扩充归档
async function autoExpandArchive() {
  const today = new Date();
  const dates = [];
  for (let i = 0; i <= 3; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    dates.push(key);
  }
  for (const dateStr of dates) {
    await fetchAndMergeHistory(dateStr);
  }
}

function showToast(msg, type) {
  type = type || 'info';
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

function toggleStar(id) {
  if (starred.includes(id)) {
    starred = starred.filter(s => s !== id);
    showToast('已取消收藏', 'info');
  } else {
    starred.push(id);
    showToast('已收藏 ⭐', 'success');
  }
  saveStarred();
  render();
}

function markRead(id) {
  if (!readIds.includes(id)) {
    readIds.push(id);
    if (readIds.length > 500) readIds = readIds.slice(-300);
    saveRead();
    render();
  }
}

function addHistory(item) {
  history = history.filter(h => h.id !== item.id);
  history.unshift({ id: item.id, title: item.title, source: item.source, time: new Date().toISOString() });
  if (history.length > 50) history = history.slice(0, 50);
  saveHistory();
}

function isToday(iso) {
  const d = new Date(iso);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() &&
         d.getMonth() === now.getMonth() &&
         d.getDate() === now.getDate();
}

function isThisWeek(iso) {
  const d = new Date(iso);
  const weekAgo = new Date(Date.now() - 7*86400000);
  return d >= weekAgo;
}

// ===== RENDER with Entrance Animation =====
function render() {
  const grid = document.getElementById('cardsGrid');
  const emptyState = document.getElementById('emptyState');
  const resultCount = document.getElementById('resultCount');

  let items = [...getActiveData()];

  // Time filter
  if (currentTime === 'today') {
    items = items.filter(d => isToday(d.publishedAt));
  } else if (currentTime === 'week') {
    items = items.filter(d => isThisWeek(d.publishedAt));
  } else if (currentTime === 'starred') {
    items = items.filter(d => starred.includes(d.id));
  }

  // Category filter
  if (currentTime !== 'starred' && currentCat !== 'all') {
    items = items.filter(d => d.category === currentCat);
  }

  // Region filter
  if (currentRegion === 'cn') {
    items = items.filter(d => isDomestic(d.source));
  }

  // Search
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    items = items.filter(d =>
      d.title.toLowerCase().includes(q) ||
      d.summary.toLowerCase().includes(q) ||
      d.source.toLowerCase().includes(q)
    );
  }

  // Sort
  if (currentSort === 'time') {
    items.sort((a,b) => new Date(b.publishedAt) - new Date(a.publishedAt));
  } else {
    items.sort((a,b) => b.score - a.score);
  }

  resultCount.textContent = '共 ' + items.length + ' 条';

  if (items.length === 0) {
    grid.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }

  emptyState.style.display = 'none';

  // 渲染卡片，带入场动画延迟
  grid.innerHTML = items.map((d, i) => {
    const catLabel = CAT_LABELS[d.category] || d.category;
    const isStarred = starred.includes(d.id);
    const isRead = readIds.includes(d.id);
    const catClass = 'cat-' + (d.category || 'tip');
    const sc = scoreClass(d.score);
    const delay = Math.min(i * 0.13, 2.6); // 每张卡片错开 130ms，最大 2.6s
    return `
    <article class="card ${isRead || !isThisWeek(d.publishedAt) ? 'read' : 'unread'} animate-in" id="card-${d.id}" style="animation-delay: ${delay}s">
      <div class="card-header">
        <span class="category-tag ${catClass}">${catLabel}</span>
      </div>
      <div class="card-title">${d.title}</div>
      <div class="card-meta">
        <span class="card-source">${d.source}</span>
        <span>${timeAgo(d.publishedAt)}</span>
        <span>${timeFull(d.publishedAt)}</span>
        <span class="card-score ${sc}">热度 ${d.score}</span>
      </div>
      <div class="card-summary">${d.summary}</div>
      <div class="card-actions">
        <a href="${d.url}" target="_blank" rel="noopener" class="btn-link"
           onclick="markRead('${d.id}'); addHistory(getActiveData().find(x=>x.id==='${d.id}'))">
          查看原文 →
        </a>
        <button class="btn-star ${isStarred ? 'starred' : ''}" onclick="event.stopPropagation(); toggleStar('${d.id}')" title="收藏">
          ${isStarred ? '★' : '☆'}<span class="star-hint">收藏</span>
        </button>
      </div>
    </article>`;  // render() template
  }).join('');

  updateStats();
  updateChips();
}

function updateStats() {
  document.getElementById('statStarred').textContent = starred.length;
  document.getElementById('starredCount').textContent = starred.length;

  const activeData = historyData !== null ? historyData : dataArchive;
  const todayCount = activeData.filter(d => isToday(d.publishedAt)).length;
  document.getElementById('statToday').textContent = todayCount;
  document.getElementById('statWeek').textContent = activeData.length;

  // 归档总量
  const archiveEl = document.getElementById('statArchive');
  if (archiveEl) archiveEl.textContent = dataArchive.length;

  // 更新历史提示
  const hintEl = document.getElementById('historyHint');
  if (hintEl && dataArchive.length > 0) {
    const groups = groupByDate(dataArchive);
    const dates = Object.keys(groups).sort();
    hintEl.textContent = '已存储 ' + dates.length + ' 天 · 共 ' + dataArchive.length + ' 条';
  }

  document.querySelectorAll('.stat-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.time === currentTime);
  });
}

// ===== EVENT LISTENERS =====

document.getElementById('stats').addEventListener('click', e => {
  const btn = e.target.closest('.stat-btn');
  if (!btn) return;
  const time = btn.dataset.time;
  if (currentTime === time) {
    currentTime = 'all';
  } else {
    currentTime = time;
  }

document.getElementById('filterTags').addEventListener('click', e => {

document.getElementById('regionTags').addEventListener('click', e => {
  if (!e.target.classList.contains('filter-tag')) return;
  document.querySelectorAll('#regionTags .filter-tag').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value.trim();
  render();
});

document.getElementById('sortTime').addEventListener('click', function() {

  document.getElementById('sortTime').classList.add('active');

});
document.getElementById('sortScore').addEventListener('click', function() {

  document.getElementById('sortScore').classList.add('active');

// ===== GRADIENT DROPDOWN =====
let gradientMode = 1;
const GRADIENT_MODES = ['gradient-off', 'gradient-hori', 'gradient-diag', 'gradient-custom'];
const GRADIENT_LABELS = ['渐变', '呼吸', '斜角', '自定义'];

// 点击主按钮切换下拉
document.getElementById('gradientToggle').addEventListener('click', function(e) {
  e.stopPropagation();
  document.getElementById('gradientDropdown').classList.toggle('show');
});

// 点击选项
document.querySelectorAll('.gradient-option').forEach(opt => {
  opt.addEventListener('click', function(e) {
    e.stopPropagation();
    gradientMode = parseInt(this.dataset.mode);
    applyGradient();
    document.getElementById('gradientDropdown').classList.remove('show');
  });
});

// 点击外部关闭
document.addEventListener('click', function() {
  document.getElementById('gradientDropdown').classList.remove('show');
});

function applyGradient() {
  const main = document.querySelector('.main');
  const toggle = document.getElementById('gradientToggle');
  const label = document.getElementById('gradientLabel');

  GRADIENT_MODES.forEach(c => main.classList.remove(c));
  main.classList.add(GRADIENT_MODES[gradientMode]);

  label.textContent = GRADIENT_LABELS[gradientMode];
  if (gradientMode > 0) {
    toggle.classList.add('active');
  } else {
    toggle.classList.remove('active');
  }

  // 高亮选中项
  document.querySelectorAll('.gradient-option').forEach(o => o.classList.remove('selected'));
  document.querySelector('.gradient-option[data-mode="' + gradientMode + '"]')?.classList.add('selected');

  // 记住用户选择，刷新/更新不重置
  try { localStorage.setItem('ai_wb_gradient', String(gradientMode)); } catch(e) {}
}

// ===== CUSTOM GRADIENT UPLOAD =====
function onCustomGradient(input) {
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById('uploadStatus');

  const reader = new FileReader();
  reader.onload = function(e) {
    const html = e.target.result;
    // Extract background style from the HTML
    const styleMatch = html.match(/background\s*:\s*(linear-gradient\([^)]+\)[^;]*)/i);
    if (styleMatch) {
      const main = document.querySelector('.main');
      main.style.setProperty('--custom-gradient', styleMatch[1]);
      status.textContent = '✓ 已应用';
      status.style.color = 'var(--green)';
    } else {
      status.textContent = '✗ 未找到渐变样式';
      status.style.color = 'var(--red)';
    }
  };
  reader.readAsText(file);
}

// ===== DRAWER =====
let drawerMode = 'starred';

function toggleDrawer(mode) {
  if (drawerMode === mode && document.getElementById('drawer').classList.contains('show')) {
    closeDrawer(); return;
  }
  drawerMode = mode;
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('drawerOverlay');
  const titleEl = document.getElementById('drawerTitle');
  const bodyEl = document.getElementById('drawerBody');

  if (mode === 'starred') {
    titleEl.textContent = '⭐ 收藏夹 (' + starred.length + ')';
    if (starred.length === 0) {
      bodyEl.innerHTML = '<div class="drawer-empty">还没有收藏任何内容<br><br>在卡片上点击 ☆ 即可收藏</div>';
    } else {
      const items = starred.map(id => getActiveData().find(d => d.id === id)).filter(Boolean);
      items.sort((a,b) => new Date(b.publishedAt) - new Date(a.publishedAt));
      bodyEl.innerHTML = items.map(d => `
        <div class="drawer-item">
          <button class="remove-btn" onclick="toggleStar('${d.id}'); toggleDrawer('starred');">✕ 取消</button>
          <div class="title">${d.title}</div>
          <div class="meta">${d.source} · ${timeAgo(d.publishedAt)}</div>
          <a href="${d.url}" target="_blank">查看原文 →</a>
        </div>
      `).join('');
    }
  } else {
    titleEl.textContent = '🕐 浏览记录';
    if (history.length === 0) {
      bodyEl.innerHTML = '<div class="drawer-empty">还没有浏览记录<br><br>点击卡片上的「查看原文」会自动记录</div>';
    } else {
      bodyEl.innerHTML = history.map(h => {
        const item = getActiveData().find(d => d.id === h.id);
        return `
        <div class="drawer-item">
          <div class="title">${h.title}</div>
          <div class="meta">${h.source} · ${timeAgo(h.time)}</div>
          ${item ? '<a href="' + item.url + '" target="_blank">查看原文 →</a>' : ''}
        </div>`;
      }).join('');
    }
  }

  drawer.classList.add('show');
  overlay.classList.add('show');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawerOverlay').classList.remove('show');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer();
});

// ===== HISTORY =====
let historyData = null;
const HISTORY_BASE = 'demo/tools/history/';

function initHistoryDatepicker() {
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const dp = document.getElementById('historyDatepicker');
  dp.value = todayStr;
  dp.max = todayStr;
  const minDate = new Date(); minDate.setFullYear(minDate.getFullYear() - 1);
  dp.min = `${minDate.getFullYear()}-${String(minDate.getMonth()+1).padStart(2,'0')}-${String(minDate.getDate()).padStart(2,'0')}`;
}

async function onHistoryPick(dateStr) {
  if (!dateStr) return;
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  if (dateStr === todayStr) {
    historyData = null;
    document.getElementById('mainTitle').textContent = '📰 最新 AI 动态';
    render();
    return;
  }
  // 先从归档中查找该日期的内容
  const archiveItems = dataArchive.filter(d => {
    const itemDate = new Date(new Date(d.publishedAt).getTime() + 8 * 3600000);
    const itemKey = itemDate.getFullYear() + '-' + String(itemDate.getMonth()+1).padStart(2,'0') + '-' + String(itemDate.getDate()).padStart(2,'0');
    return itemKey === dateStr;
  });
  if (archiveItems.length > 0) {
    historyData = archiveItems;
    renderWithHistory(historyData);
    document.getElementById('mainTitle').textContent = `📅 ${dateStr} 历史快照（${archiveItems.length} 条）`;
    return;
  }
  // 归档中没有则尝试从远程拉取
  try {
    const resp = await fetch(`${HISTORY_BASE}${dateStr}.json`);
    if (!resp.ok) throw new Error();
    historyData = await resp.json();
    renderWithHistory(historyData);
    document.getElementById('mainTitle').textContent = `📅 ${dateStr} 历史快照`;
  } catch (err) {
    showToast('📭 该日期暂无快照，等它生成后再来看', 'info');
    document.getElementById('historyDatepicker').value = todayStr;
    historyData = null;
    render();
    document.getElementById('mainTitle').textContent = '📰 最新 AI 动态';
  }
}

function renderWithHistory(hData) {
  const grid = document.getElementById('cardsGrid');
  const emptyState = document.getElementById('emptyState');
  const resultCount = document.getElementById('resultCount');

  let items = [...hData];

  if (currentTime === 'today') items = items.filter(d => isToday(d.publishedAt));
  else if (currentTime === 'week') items = items.filter(d => isThisWeek(d.publishedAt));
  else if (currentTime === 'starred') items = items.filter(d => starred.includes(d.id));

  if (currentTime !== 'starred' && currentCat !== 'all') items = items.filter(d => d.category === currentCat);
  if (currentRegion === 'cn') items = items.filter(d => isDomestic(d.source));

  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    items = items.filter(d =>
      d.title.toLowerCase().includes(q) ||
      d.summary.toLowerCase().includes(q) ||
      d.source.toLowerCase().includes(q)
    );
  }

  if (currentSort === 'time') items.sort((a,b) => new Date(b.publishedAt) - new Date(a.publishedAt));
  else items.sort((a,b) => b.score - a.score);

  resultCount.textContent = '共 ' + items.length + ' 条';

  if (items.length === 0) {
    grid.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }

  emptyState.style.display = 'none';
  grid.innerHTML = items.map((d, i) => {
    const catLabel = CAT_LABELS[d.category] || d.category;
    const isStarred = starred.includes(d.id);
    const isRead = readIds.includes(d.id);
    const catClass = 'cat-' + (d.category || 'tip');
    const sc = scoreClass(d.score);
    const delay = Math.min(i * 0.13, 2.6);
    return `
    <article class="card ${isRead || !isThisWeek(d.publishedAt) ? 'read' : 'unread'} animate-in" style="animation-delay: ${delay}s">
      <div class="card-header">
        <span class="category-tag ${catClass}">${catLabel}</span>
      </div>
      <div class="card-title">${d.title}</div>
      <div class="card-meta">
        <span class="card-source">${d.source}</span>
        <span>${timeAgo(d.publishedAt)}</span>
        <span>${timeFull(d.publishedAt)}</span>
        <span class="card-score ${sc}">热度 ${d.score}</span>
      </div>
      <div class="card-summary">${d.summary}</div>
      <div class="card-actions">
        <a href="${d.url}" target="_blank" rel="noopener" class="btn-link"
           onclick="markRead('${d.id}'); addHistory(hData.find(x=>x.id==='${d.id}'))">
          查看原文 →
        </a>
        <button class="btn-star ${isStarred ? 'starred' : ''}" onclick="event.stopPropagation(); toggleStar('${d.id}')" title="收藏">
          ${isStarred ? '★' : '☆'}<span class="star-hint">收藏</span>
        </button>
      </div>
    </article>`;  // renderWithHistory() template
  }).join('');

  const todayCount = hData.filter(d => isToday(d.publishedAt)).length;
  document.getElementById('statToday').textContent = todayCount;
  document.getElementById('statWeek').textContent = hData.length;
  document.querySelectorAll('.stat-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.time === currentTime);
  });
  updateChips();
}

// Override render to support history data
(function() {
  const origRender = render;
  render = function() {
    if (historyData !== null) {
      renderWithHistory(historyData);
      return;
    }
    origRender();
  };
})();

// ===== INIT =====
(async function init() {
  const now = new Date();
  const bj = new Date(now.getTime() + 8*3600000);
  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('currentDate').textContent =
    bj.getFullYear() + '年' + (bj.getMonth()+1) + '月' + bj.getDate() + '日 ' + weekdays[bj.getDay()];

  initHistoryDatepicker();

  // 恢复用户上次选择的渐变模式（默认呼吸灯）
  try {
    const saved = parseInt(localStorage.getItem('ai_wb_gradient'));
    if (!isNaN(saved) && saved >= 0 && saved < GRADIENT_MODES.length) {
      gradientMode = saved;
    }
  } catch(e) {}
  applyGradient();

  // 1. 将嵌入式 DATA 合并到归档
  seedArchive();

  // 2. 尝试从远程 JSON 拉取历史数据扩充归档
  await autoExpandArchive();

  render();
})();
</script>
